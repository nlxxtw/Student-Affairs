<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>学生组织管理 · 数智学工</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8F%9B%EF%B8%8F%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/searchable-filter-selects.css">
<style>
:root{--primary:#12805c;--primary-d:#0d6a4b;--primary-l:#e8f5ef;--border:#dce7e2;--muted:#75847e;--bg:#f2f6f4;--card:#fff;--danger:#b3423a;--warn:#99600c;--warn-bg:#fff5e3}
*{box-sizing:border-box}
body{margin:0;font:15px/1.6 "Microsoft YaHei","PingFang SC",sans-serif;color:#2c3a34;background:var(--bg)}
a{color:#187a59}
/* 布局 */
.layout{display:block;min-height:0}
/* 本页由数智学工主系统承载：一级、二级导航均由系统左栏提供。
   永久隐藏旧独立版侧栏，避免嵌入页面再次出现双侧栏和空白区域。 */
aside{display:none!important}
aside .brand{padding:18px 16px 14px;border-bottom:1px solid rgba(255,255,255,.08)}
aside .brand b{display:block;font-size:16px;color:#fff}
aside .brand small{font-size:11.5px;color:#8fb5a8}
nav{flex:1;overflow:auto;padding:8px 0}
nav .grp{padding:10px 16px 4px;font-size:11.5px;color:#7ba795;letter-spacing:1px}
nav .item{display:flex;align-items:center;gap:8px;padding:9px 16px;cursor:pointer;font-size:13.5px;border-left:3px solid transparent;transition:.15s}
nav .item:hover{background:rgba(255,255,255,.06)}
nav .item.active{background:rgba(18,128,92,.35);border-left-color:#36c08a;color:#fff;font-weight:600}
.szo-content{min-width:0;padding:0;max-width:none}
#embeddedTabs{display:none}
.szo-third-tabs{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin:0 0 14px;padding:10px 12px;background:#fff;border:1px solid var(--border);border-radius:10px}
.szo-third-tabs b{font-size:14px;color:var(--primary-d);padding-right:5px;margin-right:2px;border-right:1px solid var(--border)}
.szo-third-tab{border:0;border-bottom:3px solid transparent;padding:7px 9px;background:transparent;color:#63736b;font:inherit;font-size:13px;cursor:pointer}
.szo-third-tab:hover{color:var(--primary)}
.szo-third-tab.active{color:var(--primary-d);border-bottom-color:var(--primary);font-weight:700}
/* 通用 */
h2.ptitle{margin:0 0 4px;font-size:19px}
.sub{color:var(--muted);font-size:13px;margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:14px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.in{height:34px;border:1px solid var(--border);border-radius:7px;padding:0 9px;background:#fff;font:inherit;min-width:120px}
.btn{display:inline-flex;align-items:center;gap:5px;height:34px;padding:0 13px;border-radius:7px;border:1px solid var(--border);background:#fff;cursor:pointer;font:inherit;font-size:13px;transition:.15s}
.btn:hover{border-color:var(--primary);color:var(--primary)}
.btn-primary{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:600}
.btn-primary:hover{background:var(--primary-d);color:#fff}
.btn-danger{color:var(--danger)}
.btn-sm{height:28px;padding:0 9px;font-size:12.5px;border-radius:6px}
.btn-ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:#f4f8f6;color:#4d5f57;font-weight:600;text-align:left;padding:9px 10px;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid #edf2f0;vertical-align:top}
tr:hover td{background:#fafdfb}
.list-scroll{overflow:auto;border:1px solid var(--border);border-radius:8px;background:#fff}
.empty{padding:26px;text-align:center;color:#9aa8a1}
.tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11.5px;background:var(--primary-l);color:var(--primary-d)}
.tag.warn{background:var(--warn-bg);color:var(--warn)}
.tag.mut{background:#eef1f0;color:#56655e}
.tag.bad{background:#fdeceb;color:var(--danger)}
.muted{color:var(--muted);font-size:12.5px}
.req{color:#c1443e;font-style:normal}
/* 统计 */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.stat-grid>div{background:#fff;border:1px solid var(--border);border-radius:10px;padding:12px}
.stat-grid small{display:block;color:var(--muted);font-size:11.5px}
.stat-grid b{display:block;font-size:23px;margin:3px 0}
/* 模态 */
.mask{position:fixed;inset:0;background:rgba(15,35,28,.45);display:none;align-items:flex-start;justify-content:center;z-index:50;padding:36px 16px;overflow:auto}
.mask.open{display:flex}
.modal{background:#fff;border-radius:12px;width:760px;max-width:100%;max-height:calc(100vh - 72px);display:flex;flex-direction:column;box-shadow:0 18px 50px rgba(0,0,0,.25)}
.modal.wide{width:960px}
.modal.xl{width:96vw;max-width:1600px}
.modal-h{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--border)}
.modal-h b{font-size:16px}
.modal-b{padding:16px 18px;overflow:auto}
.modal-f{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--border)}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.field>label{font-size:12.5px;font-weight:600;color:#41504a}
.field input,.field select,.field textarea{border:1px solid var(--border);border-radius:7px;padding:7px 9px;font:inherit;width:100%}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 2px rgba(18,128,92,.12)}
.field textarea{resize:vertical;min-height:64px}
.field input[type=radio],.field input[type=checkbox]{width:auto;padding:0;border:0;background:none;accent-color:var(--primary);margin:0 6px 0 0;vertical-align:-2px;cursor:pointer}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px 14px}
/* 组织架构树 */
.tree{border:1px dashed var(--border);border-radius:9px;padding:10px;background:#fbfdfc}
.node{border:1px solid var(--border);border-radius:8px;background:#fff;margin:6px 0}
.node-h{display:flex;align-items:center;gap:8px;padding:7px 10px;flex-wrap:wrap}
.node-h b{font-size:13.5px}
.node-h .nm{background:var(--primary-l);border-radius:6px;padding:1px 7px;font-size:12px;color:var(--primary-d)}
.node-h .ops{margin-left:auto;display:flex;gap:4px;flex-wrap:wrap}
.node-c{padding:0 10px 8px;margin-left:26px}
.att-chip{display:inline-flex;align-items:center;gap:6px;background:#f4f8f6;border:1px solid var(--border);border-radius:7px;padding:4px 8px;margin:3px 4px 0 0;font-size:12.5px}
.att-chip .x{cursor:pointer;color:#999;font-weight:700}
.att-chip .x:hover{color:var(--danger)}
.att-drop{border:1px dashed #b9dfcf;border-radius:8px;padding:8px 10px;margin-top:4px;color:var(--muted);font-size:12.5px;background:#f9fdfb}
.pager{display:flex;justify-content:flex-end;align-items:center;gap:8px;padding:10px;font-size:12.5px;color:var(--muted)}
.note{padding:10px 12px;border-left:4px solid #d99a30;background:var(--warn-bg);border-radius:7px;font-size:13px;color:#7a5a17;margin-bottom:12px}
.ok-tip{padding:10px 12px;border-left:4px solid #36a06f;background:#edf8f2;border-radius:7px;font-size:13px;color:#126b49;margin-bottom:12px}
/* 组织架构树状图（政企式自上而下 + 层级配色 + 浅灰连接线，参照用户示例图） */
.tree-chart{overflow:auto;padding:16px 32px 20px;border:1px solid var(--border);border-radius:9px;background:#fff;box-sizing:border-box}
.tree-chart ul{display:flex;justify-content:center;flex-wrap:nowrap;padding:26px 0 0;margin:0;list-style:none;position:relative;width:max-content;min-width:100%;box-sizing:border-box}
.tree-chart>ul{padding-top:0}
.tree-chart .org-root-chart{width:max-content;min-width:100%;box-sizing:border-box}
.tree-chart .org-root-chart>ul{min-width:100%;width:max-content}
.tree-chart ul ul::before{content:"";position:absolute;top:0;left:50%;border-left:1px solid #b8c4be;width:0;height:26px}
.tree-chart li{position:relative;padding:26px 8px 0;display:flex;flex-direction:column;align-items:center}
.tree-chart>ul>li{padding-top:0}
.tree-chart li::before,.tree-chart li::after{content:"";position:absolute;top:0;right:50%;width:50%;height:26px;border-top:1px solid #b8c4be}
.tree-chart li::after{right:auto;left:50%;border-left:1px solid #b8c4be}
.tree-chart>ul>li::before,.tree-chart>ul>li::after{display:none}
.tree-chart li:only-child::before,.tree-chart li:only-child::after{display:none}
.tree-chart li:only-child{padding-top:26px}
.tree-chart>ul>li:only-child{padding-top:0}
.tree-chart li:first-child::before,.tree-chart li:last-child::after{border-top:0}
.tree-chart li:last-child::before{border-right:1px solid #b8c4be;border-radius:0 8px 0 0}
.tree-chart li:first-child::after{border-radius:8px 0 0 0}
/* 企业式根节点：组织本身置顶，主席团与各职能部门均为其直属分支 */
.org-root-node{min-width:230px;max-width:340px;background:linear-gradient(135deg,#0d6248,#16815f);color:#fff;border-radius:10px;padding:11px 16px 10px;box-shadow:0 3px 10px rgba(10,79,55,.22);text-align:center}
.org-root-node b{display:block;font-size:16px;letter-spacing:.2px}
.org-root-node .root-meta{margin-top:4px;font-size:12px;line-height:1.55;color:rgba(255,255,255,.84)}
.org-root-node .root-stats{display:flex;justify-content:center;gap:9px;margin-top:6px;font-size:11.5px;color:#d9f3e7}
/* 层级配色：一级 橙 / 二级 蓝 / 三级 绿 / 四级及以下 浅蓝 */
.org-node{width:172px;min-width:172px;max-width:172px;box-sizing:border-box;background:#99CCFF;color:#1f3a52;border-radius:8px;padding:9px 10px 8px;box-shadow:0 1px 5px rgba(20,60,45,.14);text-align:center}
.org-node.d0{background:#FF9933}
.org-node.d1{background:#3399CC}
.org-node.d2{background:#66CC66}
.org-node.d0,.org-node.d1,.org-node.d2{color:#fff}
.org-node-h b{font-size:14.5px;display:block;color:inherit}
.org-node-h .org-node-role{font-size:11.5px;display:block;margin-top:2px;line-height:1.4;color:inherit;opacity:.85}
.org-node-mems{margin-top:5px;display:flex;flex-direction:column;align-items:center;gap:1px}
.org-node-mems .org-mem-line{font-size:12px;line-height:1.45;color:inherit;opacity:.95;white-space:normal;overflow-wrap:anywhere;max-width:100%}
.org-node-mems .org-mem-line.resigned{opacity:.5;text-decoration:line-through}
.org-node-ops{display:flex;gap:2px;justify-content:center;margin-top:6px;opacity:.45;transition:.15s}
.org-node:hover .org-node-ops{opacity:1}
.org-node-ops .btn{height:20px;padding:0 5px;font-size:12px;border-radius:5px;background:rgba(255,255,255,.9);border-color:transparent}
.org-node-ops .btn:hover{background:#fff}
.tree-chart li.org-editing{min-width:520px}
/* 组织架构层级表格（政企式） */
.org-table{width:100%;border-collapse:separate;border-spacing:0;font-size:13px;background:#fff;border:1px solid var(--border);border-radius:9px;overflow:hidden}
.org-table thead th{background:#f0f7f3;padding:10px 12px;text-align:left;font-weight:600;color:#4d5f57;border-bottom:2px solid var(--border);white-space:nowrap}
.org-table tbody tr{border-bottom:1px solid #edf2f0;transition:.1s}
.org-table tbody tr:hover{background:#f8fbf9}
.org-table tbody tr:last-child{border-bottom:none}
.org-table td{padding:9px 12px;vertical-align:middle}
.org-row-name{display:flex;align-items:center;gap:6px}
.org-row-name .expand-btn{width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--border);border-radius:4px;font-size:10.5px;cursor:pointer;background:#fff;color:var(--muted);flex:none}
.org-row-name .expand-btn:hover{border-color:var(--primary);color:var(--primary)}
.org-row-name .expand-btn.collapsed{transform:rotate(-90deg)}
.org-row-name .expand-btn.empty{visibility:hidden}
.org-row-name .dept-name{font-weight:600;color:#2c3a34}
.org-row-name .dept-role{color:var(--muted);font-size:12.5px;margin-left:4px}
.org-mem-chip{display:inline-flex;align-items:center;gap:4px;background:var(--primary-l);border-radius:5px;padding:2px 7px;font-size:12px;color:var(--primary-d);margin:2px 3px 2px 0;border:1px solid #d0e5d8}
.org-mem-chip.resigned{background:#f4f8f6;color:#56655e;border-color:var(--border)}
.org-ops{display:flex;gap:4px;flex-wrap:wrap}
.org-ops .btn{height:24px;padding:0 7px;font-size:11.5px;border-radius:5px}
/* 任务看板 */
.tk-board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.tk-col{background:#f7faf8;border:1px solid var(--border);border-radius:10px;padding:10px;min-height:180px}
.tk-col-h{display:flex;justify-content:space-between;align-items:center;padding:2px 4px 8px;font-size:13px}
.tk-col-h b{font-size:14px}
.tk-col-h.stage-todo b{color:#99600c}.tk-col-h.stage-doing b{color:#1d5b91}.tk-col-h.stage-done b{color:#126b49}
.tk-col-h span{background:#fff;border:1px solid var(--border);border-radius:999px;font-size:11.5px;padding:1px 8px;color:var(--muted)}
.tk-card{background:#fff;border:1px solid var(--border);border-radius:9px;padding:10px;margin-bottom:9px}
.tk-card-h{display:flex;align-items:center;gap:7px}
.tk-card-h b{font-size:13.5px}
.tk-pri{flex:none;font-size:11px;color:#fff;border-radius:5px;padding:1px 6px}
.tk-meta{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:5px}
.tk-prog{height:5px;background:#e9f1ed;border-radius:99px;overflow:hidden;margin-top:7px}
.tk-prog i{display:block;height:100%;background:#16815f;border-radius:99px}
.tk-ops{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
/* 卡片网格（招新岗位 / 架构模板库 复用） */
.rp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;margin-top:8px}
.rp-card{background:#fff;border:1px solid var(--border);border-radius:9px;padding:11px}
@media(max-width:900px){.tk-board{grid-template-columns:1fr}}
@media(max-width:900px){.layout{flex-direction:column}aside{width:100%;flex-direction:row;flex-wrap:wrap}aside .brand{width:100%}nav{display:flex;flex-wrap:wrap}nav .grp{width:100%}.grid3{grid-template-columns:1fr}.grid2{grid-template-columns:1fr}}
@media(max-width:720px){.szo-third-tabs{margin-bottom:10px}}
/* ===== 概览页美化 ===== */
.ov-hero{background:linear-gradient(120deg,#0f2f25 0%,#12805c 68%,#16976b 100%);color:#fff;border-radius:14px;padding:22px 24px;margin-bottom:18px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px;box-shadow:0 10px 26px rgba(18,128,92,.22)}
.ov-hero h1{margin:0;font-size:21px;font-weight:700;letter-spacing:.5px}
.ov-hero .ov-sub{color:rgba(255,255,255,.82);font-size:13px;margin:7px 0 0;line-height:1.5}
.ov-hero .ov-badges{display:flex;gap:12px;flex-wrap:wrap}
.ov-hero .ov-badge{background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.22);border-radius:12px;padding:10px 18px;text-align:center;min-width:78px}
.ov-hero .ov-badge b{display:block;font-size:21px;line-height:1.1}
.ov-hero .ov-badge small{display:block;font-size:12px;color:rgba(255,255,255,.8);margin-top:2px}
.ov-sec{display:flex;align-items:center;gap:9px;margin:20px 0 11px;font-size:14.5px;font-weight:700;color:#2c3a34}
.ov-sec::before{content:"";width:4px;height:16px;background:var(--primary);border-radius:3px}
.ov-sec .ov-line{flex:1;height:1px;background:var(--border)}
.ov-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(172px,1fr));gap:12px}
.ov-card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:14px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:.16s;position:relative;overflow:hidden}
.ov-card:hover{transform:translateY(-2px);box-shadow:0 9px 22px rgba(20,60,45,.12);border-color:#9fd3bf}
.ov-card .ov-ic{flex:none;width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:21px;color:#fff}
.ov-card .ov-meta{min-width:0;flex:1}
.ov-card .ov-meta small{display:block;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ov-card .ov-meta b{display:block;font-size:23px;color:#243a32;line-height:1.15;margin-top:1px}
.ov-card .ov-meta .ov-note{display:block;color:var(--muted);font-size:11.5px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ov-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.ov-row>.card{margin-bottom:0}
@media(max-width:780px){.ov-row{grid-template-columns:1fr}}
/* 日期/时间控件：确保原生日历/时间选择框可点、醒目 */
input[type=date],input[type=datetime-local]{cursor:pointer}
input[type=date].in,input[type=datetime-local].in{min-width:160px}
</style>
</head>
<body>
<div class="layout">
<aside>
  <div class="brand"><b>🏛️ 学生组织管理</b><small>数智学工 · 已接入系统数据与附件库</small></div>
  <nav id="nav"></nav>
</aside>
<section class="szo-content"><div id="embeddedTabs"></div><main id="main"></main></section>
</div>
<div class="mask" id="mask"><div class="modal" id="modal">
  <div class="modal-h"><b id="modalTitle"></b><button class="btn btn-sm btn-ghost" onclick="closeModal()">✕ 关闭</button></div>
  <div class="modal-b" id="modalBody"></div>
  <div class="modal-f" id="modalFoot"></div>
</div></div>
<input type="file" id="filePick" multiple hidden>
<script>
"use strict";
/* ================= 学生组织管理 =================
 * 嵌入状态复用父页面已完成初始化的系统桥接，避免再次读取全量存储、在线校验授权。 */
var KEY="nnuzc_student_org_v1";
var IS_EMBEDDED=new URLSearchParams(location.search).get("embedded")==="1";
var INITIAL_TAB=new URLSearchParams(location.search).get("tab")||"home";
if(IS_EMBEDDED)document.body.classList.add("embedded");
function studentOrgDemoActive(){try{return !!(IS_EMBEDDED&&window.parent&&window.parent.__WORKBENCH_DEMO__&&window.parent.__WORKBENCH_DEMO__.active);}catch(e){return false;}}
function studentOrgDemoNotice(){toast("当前为演示数据模式，不能添加或修改真实数据；请先在主系统顶部清除演示数据。","warn");}
function systemStorage(){
  /* iframe 与主系统同源时，必须在父页面的桥接上下文中读写，才能直接同步到本机数据库。 */
  try{if(IS_EMBEDDED&&window.parent&&window.parent!==window&&window.parent.localStorage)return window.parent.localStorage;}catch(e){}
  return window.localStorage;
}
function systemWorkbench(){
  try{if(IS_EMBEDDED&&window.parent&&window.parent!==window&&window.parent.workbench)return window.parent.workbench;}catch(e){}
  return window.workbench;
}
var ORG_CATS={ "union-u":"校级学生会","club-u":"校级社团","union-c":"院级学生会","club-c":"院级社团","other":"其他组织" };
var CLUB_TYPES=["思想政治类","学术科技类","文化体育类","志愿公益类","创新创业类","自律互助类"];
var ORG_STATUS=["运行中","换届中","已归档","已解散"];
var ACT_TYPES=["思想引领","学术科技","文化艺术","体育竞赛","志愿公益","社会实践","创新创业","其他"];
var ACT_STATUS=["筹备中","进行中","已结束","已取消"];
var CLASSROOM_MODULES=["思想成长","实践实习","创新创业","志愿公益","文体活动","工作履历","技能特长","其他"];
var CLASSROOM_STATUS=["待审核","已认定","未通过"];

function normalize(d){
  d=d||{};var b=blank();
  var out={
    orgs:Array.isArray(d.orgs)?d.orgs:[],
    activities:Array.isArray(d.activities)?d.activities:[],
    meetings:Array.isArray(d.meetings)?d.meetings:[],
    trainings:Array.isArray(d.trainings)?d.trainings:[],
    classrooms:Array.isArray(d.classrooms)?d.classrooms:[],
    tasks:Array.isArray(d.tasks)?d.tasks:[],
    templates:Array.isArray(d.templates)?d.templates:[],
    years:Array.isArray(d.years)?d.years:[],
    meta:d.meta||b.meta
  };
  /* 旧版成员结构（仅 姓名,学号）自动升级为干部任职模型（参考 cmsys 干部字段） */
  out.orgs.forEach(function(o){
    /* 组织层面的负责人、职务名称和联系电话已取消，负责人信息由架构节点中的岗位成员维护。 */
    ["leader","leaderTitle","phone"].forEach(function(k){if(Object.prototype.hasOwnProperty.call(o,k)){delete o[k];__orgLegacyFieldsRemoved=true;}});
    (function walk(nodes){(nodes||[]).forEach(function(n){
      n.members=(n.members||[]).map(function(m){
        if(typeof m==="string")return {sid:"",name:m,position:"",joined:"",status:"在职"};
        /* 成员考评功能已取消，同时清理旧的评分明细。 */
        if(m&&Object.prototype.hasOwnProperty.call(m,"score")){delete m.score;__orgLegacyFieldsRemoved=true;}
        return normalizeMember(m);
      });
      walk(n.children);
    });})(o.structure||[]);
  });
  /* 第二课堂不再关联学生组织，清理旧记录中的组织引用。 */
  out.classrooms.forEach(function(r){if(Object.prototype.hasOwnProperty.call(r,"orgId")){delete r.orgId;__orgLegacyFieldsRemoved=true;}});
  return out;
}

function orgSetFilter(cat,k,v){orgFilter[cat][k]=String(v||"").trim();scheduleRender();}
function orgResetFilter(cat){orgFilter[cat]={kw:"",year:"",status:"",dept:""};renderMain();}
function treeCount(nodes){var n=0;(nodes||[]).forEach(function(x){n+=1+treeCount(x.children);});return n;}
function treeMembers(nodes){var n=0;(nodes||[]).forEach(function(x){n+=(x.members||[]).length+treeMembers(x.children);});return n;}
function treeActiveMembers(nodes){var n=0;(nodes||[]).forEach(function(x){n+=(x.members||[]).filter(memberIsActive).length+treeActiveMembers(x.children);});return n;}
/* 导出组织成员名单 Excel */
function exportMembers(orgId){
  var o=DB.orgs.find(function(x){return x.id===orgId;});if(!o)return;
  var rows=[];
  (function walk(nodes,path){
    (nodes||[]).forEach(function(n){
      var p=path?path+" / "+n.name:n.name;
      (n.members||[]).forEach(function(m){rows.push([m.sid,m.name,m.college,m.grade,m.major,m.cls,m.position||n.name,m.phone||"",p,m.status,m.joined]);});
      walk(n.children,p);
    });
  })(o.structure,"");
  if(!rows.length){toast("该组织暂无成员可导出","warn");return;}
  downloadXlsxFile(o.name+"_成员名单", [["学号","姓名","学院","年级","专业","班级","职务","手机号","部门路径","状态","入会日期"],...rows], o.name+"_成员名单_"+today()+".xlsx");
  toast("已导出 "+rows.length+" 名成员","ok");
}

/* 换届向导：配置新届学年 / 届数 / 成员处理 / 旧届归档 */
function orgSuccession(id){
  var o=DB.orgs.find(function(x){return x.id===id;});if(!o)return;
  var m=o.year.match(/^(\d{4})-/),nextYear=m?(Number(m[1])+1)+"-"+(Number(m[1])+2):o.year;
  var history=DB.orgs.filter(function(x){return x.id!==o.id&&x.name===o.name;});
  /* 建议届数取同名组织最大届数+1，避免与历史届冲突 */
  var maxTerm=o.termNo||0;history.forEach(function(h){if(h.termNo>maxTerm)maxTerm=h.termNo;});
  var body='<div style="margin:0 0 12px;padding:9px 11px;background:#f4f8f6;border-radius:7px;font-size:13px">当前：'+termLabel(o.termNo)+' / '+o.year+' · 状态 '+esc(o.status)+(history.length?'　历史：'+history.map(function(h){return "第"+h.termNo+"届("+h.year.slice(0,4)+")";}).join("、"):"")+'</div>'
    +'<div class="grid2">'
    +'<div class="field"><label>新届届数<span class="req"> *</span></label><input id="s_term" type="number" min="1" value="'+(maxTerm+1)+'"></div>'
    +'<div class="field"><label>新届学年<span class="req"> *</span></label><input id="s_year" value="'+esc(nextYear)+'" placeholder="如 2026-2027"></div>'
    +'</div>'
    +'<div class="field"><label>新届成员名单处理</label><label style="font-weight:400;display:block"><input type="radio" name="s_members" value="clear" checked> 清空成员（重新录入新一届名单）</label><label style="font-weight:400;display:block;margin-top:4px"><input type="radio" name="s_members" value="keep"> 保留成员（沿用上一届名单，可再调整）</label></div>'
    +'<div class="field"><label style="font-weight:400"><input type="checkbox" id="s_archive" checked> 将'+termLabel(o.termNo)+'自动标记为「已归档」</label></div>'
    +'<div class="muted">新届初始状态为「换届中」，完成名单调整后可在编辑中改回「运行中」；架构（部门与岗位）默认整体继承。</div>';
  openModal("🔁 换届向导 · "+esc(o.name),body,"创建新一届",function(){
    var term=parseInt(Val("s_term"),10),year=Val("s_year");
    if(!term||term<=0){toast("请填写新届届数","warn");return false;}
    var mY=year.match(/^(\d{4})-(\d{4})$/);
    if(!mY||Number(mY[2])!==Number(mY[1])+1){toast("学年应为连续学年，如 2026-2027","warn");return false;}
    if(term===o.termNo){toast("新届届数不能与当前届（第 "+o.termNo+" 届）相同","warn");return false;}

function findNode(nodes,id,parent){

    if(nodes[i].id===id)return {list:nodes,index:i,node:nodes[i],parent:parent||null};
    var r=findNode(nodes[i].children||[],id,nodes[i]);
    if(r)return r;
  }
  return null;
}

function treeFilterNodes(nodes,q){
  q=String(q||"").trim().toLowerCase();
  if(!q)return nodes||[];
  return (nodes||[]).reduce(function(out,n){
    var children=treeFilterNodes(n.children||[],q);
    var hay=[n.name,n.role].concat((n.members||[]).map(function(m){return [m.name,m.sid,m.position,m.college,m.major,m.cls].join(" ");})).join(" ").toLowerCase();
    if(hay.indexOf(q)>=0){out.push(n);}
    else if(children.length){var copy=Object.assign({},n);copy.children=children;out.push(copy);}
    return out;
  },[]);
}

function treeZoomFit(){

async function nodeDel(orgId,id){
  var o=DB.orgs.find(function(x){return x.id===orgId;});if(!o)return;

}
function nodeMove(orgId,id,dir){
  var o=DB.orgs.find(function(x){return x.id===orgId;});if(!o)return;
  var r=findNode(o.structure,id);if(!r)return;
  var ni=r.index+dir;if(ni<0||ni>=r.list.length)return;
  var tmp=r.list[r.index];r.list[r.index]=r.list[ni];r.list[ni]=tmp;refreshTree();
}
function nodeLevel(orgId,id,dir){
  var o=DB.orgs.find(function(x){return x.id===orgId;});if(!o)return;
  var r=findNode(o.structure,id);if(!r)return;
  if(dir===1){ /* 降级：挂到前一个兄弟下 */
    if(r.index===0)return;
    var prev=r.list[r.index-1];prev.children=prev.children||[];
    r.list.splice(r.index,1);prev.children.push(r.node);
  }else{ /* 升级：移到父级之后 */
    if(!r.parent){toast("一级部门无法再升级","warn");return;}
    var pr=findNode(o.structure,r.parent.id);
    r.list.splice(r.index,1);
    var pi=pr.list.indexOf(r.parent);pr.list.splice(pi+1,0,r.node);
  }
  refreshTree();
}
function structureReset(orgId){
  var o=DB.orgs.find(function(x){return x.id===orgId;});if(!o)return;

function exportStructure(orgId){

  var lines=[ORG_CATS[o.cat]+" · "+o.name+"（"+o.year+" 第"+o.termNo+"届）"];
  (function walk(nodes,depth){
    (nodes||[]).forEach(function(n){
      var pre="  ".repeat(depth)+(depth?"└ ":"");
      lines.push(pre+n.name+(n.role?"（"+n.role+"）":"")+(n.members&&n.members.length?"："+n.members.map(function(m){return (m.name||m.sid||"未命名")+(m.sid?"("+m.sid+")":"");}).join("、"):""));
      walk(n.children,depth+1);
    });
  })(o.structure,0);
  downloadFile(o.name+"_组织架构.txt",lines.join("\r\n"),"text/plain");
}

function memberTransferForm(orgId){
  var o=DB.orgs.find(function(x){return x.id===orgId;});if(!o)return;
  var list=orgFlatMembers(o);
  if(!list.length){toast("该组织暂无成员可调动","warn");return;}

  }).join("");

      var toId=sel.value;if(!toId)return;
      var from=findNode(o.structure,sel.getAttribute("data-from"));

      if(!from||!target||from.node.id===target.node.id)return;
      var sid=sel.getAttribute("data-sid"),name=sel.getAttribute("data-name");
      var idx=(from.node.members||[]).findIndex(function(m){return (sid&&m.sid===sid)||(!sid&&m.name===name);});

      target.node.members.push(member);
      moves++;
    });

function recYear(r){
  if(r.year)return r.year;
  /* 无 year 字段的台账（活动/会议/培训）按日期推导学年：9 月及以后归入新学年 */
  var m=String(r.date||r.datetime||"").match(/^(\d{4})-(\d{2})/);
  if(m){var y=Number(m[1]),mo=Number(m[2]);return mo>=8?y+"-"+(y+1):(y-1)+"-"+y;}
  return "";
}
function fl_yearMatch(ry,sel){
  if(!ry)return true;
  var y1=String(sel).slice(0,4);
  var y2=String(sel).slice(5,9);
  var r=String(ry);
  return r===sel||r===y1||r===y2;
}

    var sig=function(r){return JSON.stringify(M.fields.map(function(f){return r[f.k];}));};

    for(var i=1;i<rows.length;i++){

            var fo=M.fields.find(function(x){return x.k==="orgId";});
            if(fo&&fo.req)valid=false;
          }
          continue;
        }
        var f=M.fields.find(function(x){return x.k===k;});
        if(f&&f.type==="sel"&&v&&Array.isArray(f.opts)&&f.opts.indexOf(v)<0)valid=false;
        if(f&&f.type==="num")v=v===""?"":Math.max(0,Number(v)||0);
        row[k]=v;

      }
      if(valid){
        if(kind==="classroom")studentOrgHydrateClassroom(row);
        var s=sig(row);
        if(seen.has(s)){dupSkipped++;}
        else{seen.add(s);DB[kindKey(kind)].unshift(row);added++;}

    var uk=Object.keys(unknownOrgs);
    toast("导入完成：新增 "+added+" 条"+(dupSkipped?"，跳过重复 "+dupSkipped+" 条（与现有记录完全相同）":"")+(skipped?"，跳过 "+skipped+" 条（必填缺失、组织不存在或固定选项无效）":"")+(uk.length?"；未匹配组织："+uk.slice(0,5).join("、")+(uk.length>5?" 等":""):""),added?"ok":"warn");
    return true;
}

function importStructRows(orgId,rows){
  var o=DB.orgs.find(function(x){return x.id===orgId;});if(!o)return false;
  if(rows.length<2){toast("文件没有数据行","warn");return false;}
  var head=rows[0].map(function(x){return String(x).trim();});
  var col=Object.create(null);head.forEach(function(h,i){col[h]=i;});
  if(col["部门路径"]==null&&col["姓名"]==null){toast("表头至少需要「部门路径」或「姓名」列，已终止导入","warn");return false;}
  var newDept=0,newMem=0,dupMem=0,skipped=0;
  /* 按部门路径查找/创建节点链（“办公室/文书组”支持全角斜杠），返回末级节点 */
  function ensureNode(path,role){
    var segs=String(path||"").split(/[/／]/).map(function(s){return s.trim();}).filter(Boolean);
    if(!segs.length)return null;
    var list=o.structure;
    var node=null;
    segs.forEach(function(seg){
      var found=list.find(function(n){return n.name===seg;});
      if(!found){found={id:uid("n"),name:seg,role:role||"",members:[],children:[]};list.push(found);newDept++;}
      else if(role&&!found.role)found.role=role;
      node=found;list=found.children=found.children||[];
    });
    return node;
  }
  for(var i=1;i<rows.length;i++){
    var r=rows[i]||[];
    var g=function(h){var v=col[h]==null?"":r[col[h]];return String(v==null?"":v).trim();};
    var name=g("姓名"),sid=g("学号"),path=g("部门路径");
    if(!name&&!sid&&!path){skipped++;continue;}
    var rawStatus=g("状态");if(rawStatus&&MEMBER_STATUSES.indexOf(rawStatus)<0){skipped++;continue;}
    var node=ensureNode(path,g("部门职责"));
    if(!node){skipped++;continue;}
    if(!name&&!sid)continue; /* 仅建部门的行 */
    if(node.members.some(function(m){return (sid&&m.sid===sid)||(!sid&&m.name===name);})){dupMem++;continue;}
    var st=normalizeMemberStatus(rawStatus);
    node.members.push(normalizeMember(studentOrgHydrateMember({sid:sid,name:name,position:g("职务"),phone:g("手机号"),joined:g("入会日期"),status:st,college:g("学院"),grade:g("年级"),major:g("专业"),cls:g("班级")})));
    newMem++;
  }
  o.updatedAt=new Date().toISOString();
  save();refreshTree();
  toast("架构导入完成：新增部门 "+newDept+" 个、成员 "+newMem+" 名"+(dupMem?"，跳过重复成员 "+dupMem+" 名（同学号/同名已存在）":"")+(skipped?"，跳过无效行 "+skipped+" 行":""),(newDept+newMem)?"ok":"warn");
  return true;
}

  var types=["图片","PDF","Word","表格","演示","压缩包","其他"];
  var rows=items.map(function(it){
    return '<tr><td style="min-width:150px"><b>'+esc(it.att.name)+'</b></td><td><span class="tag mut">'+attType(it.att.name)+'</span></td><td>'+esc(it.kindLabel)+'</td><td>'+esc(it.recName||"—")+'</td><td class="muted">'+fmtSize(it.att.size)+'</td><td class="muted">'+esc((it.att.ts||"").slice(0,10)||"—")+'</td><td style="white-space:nowrap"><a href="javascript:void(0)" onclick="attDownload(\''+it.kind+'\',\''+it.recId+'\',\''+it.att.id+'\')">下载</a>　<a href="javascript:void(0)" onclick="jumpToRecord(\''+it.kind+'\',\''+it.recId+'\')">打开记录</a></td></tr>';
  }).join("")||'<tr><td colspan="7" class="empty">暂无附件；在各记录的编辑弹窗中可上传</td></tr>';
  return '<h2 class="ptitle">📁 资料库</h2><p class="sub">全部记录附件的聚合视图，支持按名称、来源和类型检索下载。</p>'
    +'<div class="card" style="padding:12px"><div class="toolbar"><input class="in" id="libKw" style="flex:1;min-width:170px" placeholder="搜索文件名或来源记录…" value="'+esc(libraryFilter.kw)+'" oninput="libraryFilter.kw=this.value;scheduleRender()"><select class="in" onchange="libraryFilter.type=this.value;renderMain()"><option value="">全部类型</option>'+types.map(function(t){return '<option value="'+t+'"'+(libraryFilter.type===t?" selected":"")+'>'+t+'</option>';}).join("")+'</select><span style="flex:1"></span><span class="muted">共 '+items.length+' 个附件</span></div></div>'
    +'<div class="list-scroll"><table><thead><tr><th>文件名</th><th>类型</th><th>来源模块</th><th>来源记录</th><th>大小</th><th>上传日期</th><th>操作</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
}
function jumpToRecord(kind,id){
  if(kind==="orgs"){orgForm(id);return;}
  /* 资料库的 kind 是存储键（activities 等），映射回台账页签键 */
  var map={activities:"activity",meetings:"meeting",trainings:"training",classrooms:"classroom"};
  var k=map[kind]||kind;
  if(LIST_META[k]){go(k);recForm(k,id);}
}
/* ---------- 成员考评（参考 -web-main：三分数加权 30/35/35 + 条形图） ---------- */
function orgFlatMembers(o){
  var out=[];
  (function walk(nodes,path){(nodes||[]).forEach(function(n){
    var p=path?path+" / "+n.name:n.name;
    (n.members||[]).forEach(function(m){out.push({member:m,dept:p,node:n});});
    walk(n.children,p);
  });})(o.structure||[]);
  return out;
}
/* 学号在活动参与名单中出现的次数（attendees 每行：姓名,学号） */
function memberActCount(sid){
  if(!sid)return 0;
  return DB.activities.filter(function(a){
    return String(a.attendees||"").split(/[\n;；]+/).some(function(line){
      /* 兼容「姓名,学号」「姓名，学号」「姓名 学号」等写法，学号出现在任一段即计入 */
      return line.split(/[,，\s]+/).some(function(p){return p.trim()===sid;});
    });
  }).length;
}
function orgReview(orgId){
  var o=DB.orgs.find(function(x){return x.id===orgId;});if(!o)return;
  var list=orgFlatMembers(o);
  if(!list.length){toast("该组织暂无成员，请先在架构中添加","warn");return;}
  var rows=list.map(function(it,i){
    var m=it.member,sc=m.score||{};
    var total=Math.round(((Number(sc.act)||0)*0.3+(Number(sc.peer)||0)*0.35+(Number(sc.svc)||0)*0.35)*10)/10;
    return '<tr data-idx="'+i+'" data-sid="'+esc(m.sid)+'"><td>'+(i+1)+'</td><td><b>'+esc(m.name||"未命名")+'</b></td><td class="muted">'+esc(m.sid||"—")+'</td><td>'+esc(it.dept)+'</td><td>'+esc(m.position||"—")+'</td><td>'+memberActCount(m.sid)+'</td>'
      +'<td><input class="rv rv-act" type="number" min="0" max="100" style="width:64px" value="'+esc(sc.act||"")+'" placeholder="0-100"></td>'
      +'<td><input class="rv rv-peer" type="number" min="0" max="100" style="width:64px" value="'+esc(sc.peer||"")+'" placeholder="0-100"></td>'
      +'<td><input class="rv rv-svc" type="number" min="0" max="100" style="width:64px" value="'+esc(sc.svc||"")+'" placeholder="0-100"></td>'
      +'<td class="rv-total" style="font-weight:700">'+total+'</td></tr>';
  }).join("");
  var body='<div class="muted" style="margin-bottom:8px">综合总分 = 活动参与分×30% + 互评分×35% + 服务反馈分×35%（参考学业发展中心考评模型）；输入分数即时重算，保存后写入成员档案。活动数为该学号出现在活动「参与名单」中的次数。</div>'
    +'<div class="list-scroll"><table style="font-size:13.5px"><thead><tr><th>#</th><th>姓名</th><th>学号</th><th>部门</th><th>职务</th><th>活动数</th><th>活动参与分</th><th>互评分</th><th>服务反馈分</th><th>综合总分</th></tr></thead><tbody id="rvRows" data-org="'+orgId+'">'+rows+'</tbody></table></div>'
    +'<div id="rvChart" style="margin-top:10px"></div>'
    +'<div class="toolbar" style="margin-top:10px"><button class="btn btn-sm btn-ghost" onclick="exportReviewCsv(\''+orgId+'\')">📄 导出考评 Excel</button><span class="muted">导出当前分数（含未保存的输入不会包含，请先保存）</span></div>';
  openModal("📈 成员考评 · "+esc(o.name),body,"保存考评",function(){orgReviewSave();orgOpen(orgId);return false;},true);
  orgReviewChart();
  var mb=document.getElementById("modalBody");
  if(mb&&!mb.__rvBound){
    mb.__rvBound=true;
    mb.addEventListener("input",function(e){
      if(e.target&&e.target.classList&&e.target.classList.contains("rv")&&e.target.closest)orgReviewRow(e.target.closest("tr"));
    });
  }
}
function orgReviewRow(tr){
  if(!tr)return;
  var clamp=function(sel){return Math.max(0,Math.min(100,Number(tr.querySelector(sel).value)||0));};
  var act=clamp(".rv-act"),peer=clamp(".rv-peer"),svc=clamp(".rv-svc");
  tr.querySelector(".rv-total").textContent=Math.round((act*0.3+peer*0.35+svc*0.35)*10)/10;
}
function orgReviewChart(){
  var box=document.getElementById("rvChart");if(!box)return;
  var trs=Array.from(document.querySelectorAll("#rvRows tr"));
  var data=trs.map(function(tr){
    var tds=tr.querySelectorAll("td");
    return {name:tds[1].textContent,sid:tds[2].textContent,total:Number(tr.querySelector(".rv-total").textContent)||0};
  }).sort(function(a,b){return b.total-a.total;}).slice(0,12);
  var max=Math.max(1,...data.map(function(d){return d.total;}));
  box.innerHTML='<b style="font-size:13px">综合总分排行（前 12）</b>'+data.map(function(d){
    return '<div style="display:grid;grid-template-columns:110px 1fr 44px;gap:8px;align-items:center;margin:5px 0;font-size:12.5px"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(d.name)+'</span><i style="height:9px;background:#e8f3ee;border-radius:99px;overflow:hidden"><b style="display:block;height:100%;width:'+Math.round(d.total/max*100)+'%;background:linear-gradient(90deg,#16815f,#36c08a)"></b></i><strong style="text-align:right">'+d.total+'</strong></div>';
  }).join("");
}
function orgReviewSave(){
  var tbody=document.getElementById("rvRows");if(!tbody)return;
  var orgId=tbody.getAttribute("data-org"),o=DB.orgs.find(function(x){return x.id===orgId;});if(!o)return;
  /* 按行索引对应 orgFlatMembers 展开序，无学号成员也能保存考评 */
  var flat=orgFlatMembers(o);
  var n=0;
  Array.from(tbody.querySelectorAll("tr")).forEach(function(tr){
    var it=flat[Number(tr.getAttribute("data-idx"))];if(!it||!it.member)return;
    it.member.score={act:Math.max(0,Math.min(100,Number(tr.querySelector(".rv-act").value)||0)),peer:Math.max(0,Math.min(100,Number(tr.querySelector(".rv-peer").value)||0)),svc:Math.max(0,Math.min(100,Number(tr.querySelector(".rv-svc").value)||0))};
    n++;
  });
  save();toast("已保存 "+n+" 名成员的考评","ok");
}
function exportReviewCsv(orgId){
  var o=DB.orgs.find(function(x){return x.id===orgId;});if(!o)return;
  var list=orgFlatMembers(o);if(!list.length){toast("暂无成员","warn");return;}
  var head=["学号","姓名","学院","年级","专业","班级","职务","部门","状态","活动数","活动参与分","互评分","服务反馈分","综合总分"];
  var rows=list.map(function(it){var m=it.member,sc=m.score||{};return [m.sid,m.name,m.college,m.grade,m.major,m.cls,m.position,it.dept,m.status,memberActCount(m.sid),sc.act||"",sc.peer||"",sc.svc||"",Math.round(((Number(sc.act)||0)*0.3+(Number(sc.peer)||0)*0.35+(Number(sc.svc)||0)*0.35)*10)/10];});
  downloadXlsxFile(o.name+"_成员考评",[head].concat(rows),o.name+"_成员考评_"+today()+".xlsx");
  toast("已导出 "+rows.length+" 名成员考评","ok");
}

/* ---------- 组织学年小结（文本报告） ---------- */
function exportOrgReport(orgId){
  var o=DB.orgs.find(function(x){return x.id===orgId;});if(!o)return;
  var acts=DB.activities.filter(function(a){return a.orgId===orgId;});
  var meets=DB.meetings.filter(function(a){return a.orgId===orgId;});
  var trains=DB.trainings.filter(function(a){return a.orgId===orgId;});
  var num=function(v){return Number(v)||0;};
  var budget=acts.reduce(function(s,a){return s+num(a.budget);},0),expense=acts.reduce(function(s,a){return s+num(a.expense);},0),sponsor=acts.reduce(function(s,a){return s+num(a.sponsor);},0);
  var expected=meets.reduce(function(s,m){return s+num(m.expected);},0),actual=meets.reduce(function(s,m){return s+num(m.actual);},0);
  var lines=[];
  lines.push("=== "+ORG_CATS[o.cat]+" · "+o.name+" 学年小结 ===");
  lines.push("学年："+o.year+"　届数：第"+o.termNo+"届"+(o.dept?"　学院："+o.dept:""));
  lines.push("指导老师："+(o.advisor||"—")+"　状态："+o.status);
  lines.push("生成时间："+new Date().toLocaleString());
  lines.push("");
  lines.push("【组织概况】");
  lines.push("部门/岗位数："+treeCount(o.structure)+"　成员数："+treeMembers(o.structure)+"（在职 "+treeActiveMembers(o.structure)+"）");
  lines.push("");
  lines.push("【活动开展】共 "+acts.length+" 项；预算合计 "+budget+" 元，实际支出 "+expense+" 元，赞助 "+sponsor+" 元，结余 "+(budget+sponsor-expense)+" 元");
  acts.forEach(function(a){lines.push("　· "+(a.date||"—")+"　"+(a.name||"未命名")+"（"+(a.type||"")+" / "+(a.status||"")+"，"+(num(a.scale))+"人"+(num(a.expense)?"，支出"+a.expense+"元":"")+"）");});
  lines.push("");
  lines.push("【会议情况】共 "+meets.length+" 次；应到合计 "+expected+" 人次，实到 "+actual+" 人次，出勤率 "+(expected?Math.round(actual/expected*1000)/10:0)+"%");
  meets.forEach(function(m){lines.push("　· "+m.datetime+"　"+m.title+"（应到"+(m.expected||0)+"/实到"+(m.actual||0)+"）");});
  lines.push("");
  lines.push("【培训情况】共 "+trains.length+" 次，累计 "+trains.reduce(function(s,t){return s+num(t.hours);},0)+" 学时、"+trains.reduce(function(s,t){return s+num(t.count);},0)+" 人次");
  trains.forEach(function(t){lines.push("　· "+t.date+"　"+t.name+"（"+(t.count||0)+"人 / "+(t.hours||0)+"学时）");});
  lines.push("【组织架构】");
  (function walk(nodes,depth){(nodes||[]).forEach(function(n){
    lines.push("  ".repeat(depth)+(depth?"└ ":"")+(n.name||"未命名")+(n.role?"（"+n.role+"）":"")+(n.members&&n.members.length?"："+n.members.map(function(m){return (m.name||m.sid||"未命名")+(m.position?"("+m.position+")":"");}).join("、"):""));
    walk(n.children,depth+1);
  });})(o.structure,0);
  downloadFile(o.name+"_学年小结_"+today()+".txt",lines.join("\r\n"),"text/plain");
  toast("学年小结已导出","ok");
}

/* ---------- 会议纪要导出 ---------- */
function exportMeeting(id){
  var m=DB.meetings.find(function(x){return x.id===id;});if(!m)return;
  var lines=["=== 会议纪要 ===","组织："+orgName(m.orgId),"主题："+m.title,"时间："+(m.datetime||"—")+"　地点："+(m.place||"—"),"主持人："+(m.host||"—")+"　记录人："+(m.recorder||"—"),
  "出勤：应到 "+(m.expected||0)+" 人，实到 "+(m.actual||0)+" 人，请假 "+(m.leave||0)+" 人，缺席 "+(m.absent||0)+" 人","",
  "【出席人员】",(m.attendees||"未记录"),"",
  "【议题】",(m.agenda||"无"),"",
  "【决议事项】",(m.resolutions||"无"),"",
  "导出时间："+new Date().toLocaleString()];
  downloadFile("会议纪要_"+(m.title||"未命名")+"_"+today()+".txt",lines.join("\r\n"),"text/plain");
  toast("会议纪要已导出","ok");
}
/* ---------- 学年管理（总览：增删学年，所有学年下拉从此读取） ---------- */
function yearManageHtml(){
  var yrs=(DB.years||[]).slice();
  yrs.sort(function(a,b){return String(b).localeCompare(String(a));});
  var rows=yrs.map(function(y){
    var cnt=DB.orgs.filter(function(o){return o.year===y;}).length;
    var ccN=DB.classrooms.filter(function(c){return c.year===y;}).length;
    var usage=(cnt?cnt+" 个组织":"")+(ccN?(cnt?" · ":"")+"第二课堂 "+ccN+" 条":"");
    return '<tr><td><b>'+esc(y)+'</b> 学年</td><td>'+(usage||"未被使用")+'</td><td style="white-space:nowrap"><a href="javascript:void(0)" onclick="yearDelete(\''+y.replace(/'/g,"\\'")+'\')">删除</a></td></tr>';
  }).join("")||'<tr><td colspan="3" class="empty">暂无学年，请点击下方「＋ 新增学年」</td></tr>';
  return '<h2 class="ptitle">🗓️ 学年管理</h2><p class="sub">管理部门可用学年列表。新增组织、第二课堂等模块的下拉学年从此处读取。删除学年不会改动已登记组织的数据，但会使其不再出现在新增下拉框中。</p>'
    +'<div class="card"><div class="toolbar"><b>当前学年列表（'+yrs.length+'）</b><span style="flex:1"></span><button class="btn btn-primary btn-sm" onclick="yearAdd()">＋ 新增学年</button></div>'
    +'<div class="list-scroll" style="margin-top:10px"><table><thead><tr><th>学年</th><th>使用情况</th><th>操作</th></tr></thead><tbody>'+rows+'</tbody></table></div>'
    +'<div class="muted" style="margin-top:10px">提示：学年采用「起始年-(起始年+1)」的学年制（如 2026-2027），与组织、第二课堂的学年口径一致。</div></div>';
}
function yearAdd(){
  var y=Number(curAcademicYear().slice(0,4));
  var body='<div class="field"><label>起始学年</label><input id="y_start" type="number" min="2000" max="2100" value="'+y+'" oninput="yearPreview()"><div class="muted" style="margin-top:4px">将自动生成「起始年 - (起始年+1)」学年制</div></div>'
    +'<div class="field"><label>将添加的学年</label><div id="y_preview" style="padding:8px 0;font-size:17px">'+y+'-'+(y+1)+'</div></div>';
  openModal("新增学年",body,"添加",function(){
    var s=parseInt(Val("y_start"),10);
    if(!s||s<2000||s>2100){toast("请输入 2000–2100 之间的起始学年","warn");return false;}
    var val=s+"-"+(s+1);
    if((DB.years||[]).indexOf(val)>=0){toast("该学年已存在","warn");return false;}
    DB.years=DB.years||[];DB.years.push(val);save();renderMain();toast("已添加 "+val+" 学年","ok");return true;
  });
}
function yearPreview(){
  var s=parseInt(Val("y_start"),10);
  var el=document.getElementById("y_preview");
  if(el)el.innerHTML=(s||"")+'-'+((s||0)+1);
}
async function yearDelete(y){
  var cnt=DB.orgs.filter(function(o){return o.year===y;}).length;
  var ccN=DB.classrooms.filter(function(c){return c.year===y;}).length;
  if((cnt||ccN)&&!confirm("当前有 "+cnt+" 个组织、"+ccN+" 条第二课堂记录使用该学年；移入回收站后这些记录仍保留原学年值。是否继续？"))return;
  if(await studentOrgRecycle("studentOrgYear","student_org_year",[y]))toast(y+" 学年已移入回收站","ok");
}

/* ---------- 模态与提示 ---------- */
function Val(id){var el=document.getElementById(id);return String(el&&el.value!=null?el.value:"").trim();}
/* 模态链令牌：onOk 内部再打开新模态（如保存后进入架构编辑器）时，
 * 旧模态的收尾 closeModal 不得关掉新模态；以令牌比对跳过 */
var __modalSeq=0;
function openModal(title,body,okText,onOk,wide){
  var tok=++__modalSeq;
  document.getElementById("modalTitle").innerHTML=title;
  document.getElementById("modalBody").innerHTML=body;
  document.getElementById("modalFoot").innerHTML='<button class="btn" onclick="closeModal()">取消</button><button class="btn btn-primary" id="modalOk">'+esc(okText||"确定")+'</button>';
  document.getElementById("modal").className="modal"+(wide==="xl"?" xl":wide?" wide":"");
  document.getElementById("modalOk").onclick=function(){if(onOk&&onOk()===false)return;if(tok===__modalSeq)closeModal();};
  document.getElementById("mask").classList.add("open");
}
function closeModal(){
  document.getElementById("mask").classList.remove("open");
  /* 清理未保存的节点编辑态，避免残留到下次打开的弹窗 */
  window.__editingNode=null;window.__extraRows=null;
}
/* 遮罩点击不再关闭弹窗：仅 X 按钮（modal-h 内）与弹窗内按钮可关闭 */
/* ESC 不再关闭弹窗：仅 X 按钮与弹窗内按钮可关闭 */
function toast(msg,type){
  var colors={ok:["#126b49","#edf8f2"],warn:["#99600c","#fff5e3"],info:["#1d5b91","#edf5fd"]};
  var c=colors[type]||colors.info;
  var t=document.createElement("div");
  t.textContent=msg;
  t.style.cssText="position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:99;padding:9px 16px;border-radius:8px;color:"+c[0]+";background:"+c[1]+";box-shadow:0 4px 14px rgba(0,0,0,.12);font-size:13px;max-width:80vw";
  document.body.appendChild(t);
  setTimeout(function(){t.remove();},2600);
}

/* ---------- 启动 ---------- */
renderNav();renderMain();
</script>
